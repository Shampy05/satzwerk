[project]
name = "satzwerk"
version = "0.1.0"
description = "AI-Driven German Language Syntax Analyzer API"
readme = "README.md"
authors = [
    { name = "Pranshu (Pax) Sharma", email = "sharmapranshu317@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.142.1",
    "greenlet>=3.5.6",
    "litellm>=1.103.1",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "redis>=5.3.1",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
    "python-dotenv>=1.2.3",
    "aiosmtplib>=5.1.3",
    "valkey>=6.1.1",
    "langgraph>=1.2.16",
    "langchain-core>=1.6.12",
    "langchain-litellm>=0.11.1",
    "langgraph-cli[inmem]>=0.4.36",
    "langsmith>=0.14.11",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
asyncio_mode="auto"
asyncio_default_fixture_loop_scope="session"
asyncio_default_test_loop_scope="session"
