[project]
name = "satzwerk"
version = "0.1.0"
description = "AI-Driven German Language Syntax Analyzer API"
readme = "README.md"
authors = [
    { name = "Pranshu (Pax) Sharma", email = "sharmapranshu317@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.1",
    "litellm>=1.103.1",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=5.3.1",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
