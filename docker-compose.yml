services:
  api:
    build: .
    container_name: satzwerk_api
    ports:
      - 8000:8000
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/satzwerk
      - VALKEY_URL=valkey://valkey:6379
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - postgres
      - valkey
      - jaeger
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: satzwerk_jaeger
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4318:4318"
  postgres:
    image: postgres:15-alpine
    container_name: satzwerk_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: satzwerk
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: satzwer_valkey
    restart: always
    ports:
      - "6379:6379"
  mailpit:
    image: axllent/mailpit
    container_name: satzwerk_mailpit
    restart: always
    ports:
      - "1026:1025"
      - "8025:8025"
volumes:
  postgres_data:
